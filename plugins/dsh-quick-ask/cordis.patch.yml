# ============================================================================
# dsh-quick-ask —— DSH bundle patch
# ============================================================================
# 把快速提问后端挂进 Web profile。它只做两件事：
#   1. 用 ctx.sessionController 把一次提问送进某个会话；
#   2. 用 ctx.on('session/event') 收回答，再用 ctx.llm 把回答压成一句话，
#      整个过程以 SSE 从 /dsh-quick/ask 吐给桌面客户端的便携悬浮窗。
# ============================================================================

- insert:
    - id: dsh-quick-ask
      name: dsh-quick-ask
