# ============================================================================
# dsh-theme-pack — DSH bundle patch
# ============================================================================
# 把主题包挂进 Web profile 的配置树。
#
# 桌面客户端：随安装包分发，客户端启动时自动复制到 profile 并写进 bundles，
# 不需要手工安装。源码在仓库的 plugins/dsh-theme-pack/。
#
# 手工装到别的 profile：
#   dsh plugin --profile web add <本目录的绝对路径>
# 安装后重启 dsh web，再 F5 刷新浏览器。
# ============================================================================

- insert:
    - id: dsh-theme-pack
      name: dsh-theme-pack
