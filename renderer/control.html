<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:" />
  <title>DSH 客户端控制台</title>
  <link rel="stylesheet" href="theme-tokens.css" />
  <link rel="stylesheet" href="control.css" />
</head>
<body>
  <div id="root">
    <!-- 悬浮条：收起状态就是这一条 -->
    <div class="bar" id="bar">
      <span class="console-title" id="consoleTitle">DSH 客户端控制台</span>
      <span class="console-sub" id="consoleSub">服务未运行 · 全部控制项已展开</span>
      <span class="dot" id="dot"></span>
      <span class="bar-state" id="barState">读取中</span>
      <span class="bar-balance" id="barBalance">--</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="btnQuickStart" title="启动服务">▶</button>
      <button class="icon-btn" id="btnQuickStop" title="停止服务">■</button>
      <button class="icon-btn" id="btnQuickRestart" title="重启服务">⟳</button>
      <button class="icon-btn accent" id="btnToggle" title="展开 / 收起选项栏">⋯</button>
    </div>

    <!-- 展开后的选项栏 -->
    <div class="panel hidden" id="panel">

      <section class="acc" data-key="service">
        <button class="acc-head" data-acc="service">
          <span>服务</span><span class="chev"></span>
        </button>
        <div class="acc-body">
          <p class="meta" id="serverMeta">—</p>
          <div class="row">
            <button class="btn primary" id="btnStart">▶ 启动</button>
            <button class="btn" id="btnStop">■ 停止</button>
            <button class="btn" id="btnRestart">⟳ 重启</button>
          </div>
          <div class="row">
            <button class="btn ghost" id="btnBrowser">在浏览器打开</button>
          </div>
          <p class="hint" id="serverHint"></p>
        </div>
      </section>

      <section class="acc" data-key="projects">
        <button class="acc-head" data-acc="projects">
          <span>项目</span><span class="chev"></span>
        </button>
        <div class="acc-body">
          <div id="projects"></div>
          <button class="btn tiny" id="btnAddProject">＋ 新建项目</button>
        </div>
      </section>

      <section class="acc" data-key="plugins">
        <button class="acc-head" data-acc="plugins">
          <span>插件</span><span class="badge" id="pluginCount">0</span><span class="chev"></span>
        </button>
        <div class="acc-body">
          <div id="plugins" class="plugins"></div>
          <div class="install-row">
            <input id="pluginSpec" placeholder="包名或 github:owner/repo" />
            <button class="btn tiny" id="btnPluginInstallSpec">安装</button>
          </div>
          <p class="hint">依赖 pnpm 与 GitHub 访问；安装/更新后需重启服务生效。</p>
        </div>
      </section>

      <section class="acc" data-key="logs">
        <button class="acc-head" data-acc="logs">
          <span>日志</span><span class="chev"></span>
        </button>
        <div class="acc-body">
          <div class="row between">
            <div class="chips" id="logFilters">
              <button class="chip active" data-source="all">全部</button>
              <button class="chip" data-source="server">服务</button>
              <button class="chip" data-source="client">客户端</button>
              <button class="chip" data-source="plugin">插件</button>
            </div>
            <div class="row">
              <button class="btn tiny" id="btnLogClear">清空</button>
              <button class="btn tiny ghost" id="btnLogFile">文件</button>
            </div>
          </div>
          <pre class="logs" id="logs"></pre>
        </div>
      </section>

      <section class="acc" data-key="settings">
        <button class="acc-head" data-acc="settings">
          <span>设置</span><span class="chev"></span>
        </button>
        <div class="acc-body">
          <label class="toggle"><input type="checkbox" id="optOpenAtLogin" /><span>开机自启</span></label>
          <label class="toggle"><input type="checkbox" id="optAutoStart" /><span>启动客户端时自动拉起服务</span></label>
          <label class="toggle"><input type="checkbox" id="optOpenUiOnStart" /><span>启动服务后打开界面</span></label>
          <label class="toggle"><input type="checkbox" id="optAdoptExternal" /><span>自动接管已运行实例</span></label>
          <label class="toggle"><input type="checkbox" id="optStopOnQuit" /><span>退出时停止服务</span></label>
          <label class="field"><span>界面主题</span><select id="optTheme"></select></label>
          <p class="hint" id="themeHint">主题同时切换本客户端与 DSH 界面的配色。</p>
          <dl class="env" id="env"></dl>
          <div class="row">
            <button class="btn tiny ghost" id="btnHideWindow">隐藏窗口</button>
            <button class="btn tiny danger" id="btnQuit">退出客户端</button>
          </div>
        </div>
      </section>

    </div>
  </div>
  <script src="control.js"></script>
</body>
</html>
